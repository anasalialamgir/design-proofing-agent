<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Proof Review Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #333; }
    .card { max-width: 650px; margin: 30px auto; background: white; padding: 28px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #1d3557; }
    .proof-box { border: 2px dashed #00b4d8; padding: 14px; text-align: center; margin: 20px 0; background: #fafafa; border-radius: 6px; }
    .proof-box img { max-width: 100%; height: auto; border: 1px solid #ddd; }
    .btn-row { display: flex; gap: 12px; margin-top: 14px; }
    .btn { flex: 1; padding: 12px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; font-size: 15px; }
    .btn-approve { background: #2a9d8f; }
    .btn-reject { background: #e76f51; }
    textarea { width: 95%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; margin-top: 10px; }
    .status-msg { margin-top: 16px; padding: 12px; border-radius: 6px; font-weight: bold; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎨 Customer Proof Review Portal</h2>
    <p>Please review your digital artwork proof below. Check the dimensions and cut borders before printing.</p>
    
    <div class="proof-box">
      <img src="https://dummyimage.com/600x350/e0e0e0/555555.png&text=SAMPLE+DIGITAL+PROOF+-+NOT+FOR+PRINT" alt="Artwork Proof">
      <p style="color: #666; font-size: 13px; margin-top: 8px;">Red border line indicates final cut trim area.</p>
    </div>

    <label for="notes"><strong>Revision Notes / Comments:</strong></label>
    <textarea id="notes" placeholder="Optional notes or instructions for our design team..." rows="3"></textarea>

    <div class="btn-row">
      <button class="btn btn-approve" onclick="recordChoice('APPROVED')">✓ Approve Proof</button>
      <button class="btn btn-reject" onclick="recordChoice('CHANGES REQUESTED')">✗ Request Changes</button>
    </div>

    <div id="statusBox" class="status-msg"></div>
  </div>

  <script>
    function recordChoice(decision) {
      const box = document.getElementById('statusBox');
      box.style.display = 'block';
      if (decision === 'APPROVED') {
        box.style.background = '#d4edda';
        box.style.color = '#155724';
        box.innerText = "✓ Status: Proof has been Approved. Your order will proceed to print.";
      } else {
        box.style.background = '#f8d7da';
        box.style.color = '#721c24';
        box.innerText = "✗ Status: Changes Requested. Our team will review your comments.";
      }
    }
  </script>
</body>
</html>
